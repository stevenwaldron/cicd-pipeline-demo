version: 0.2
env:
  variables:
    CONTAINER_NAME: "cicd-demo"
    IMAGE_REPO_NAME: "cicd-demo"
phases:
  pre_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export AWS_REGION=${AWS_DEFAULT_REGION}
      - export ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}" | cut -c 1-12)
  build:
    commands:
      - docker build -t "${ECR_URI}:${IMAGE_TAG}" .
      - docker push "${ECR_URI}:${IMAGE_TAG}"
  post_build:
    commands:
      - mkdir -p cicd
      - printf '[{"name":"%s","imageUri":"%s"}]\n' "${CONTAINER_NAME}" "${ECR_URI}:${IMAGE_TAG}" > cicd/imagedefinitions.json
artifacts:
  files:
    - cicd/imagedefinitions.json
